<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS - Kasir Kantin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🛒 Mini POS</h1>
            <p>Kasir & Keranjang Belanja Sederhana</p>
        </header>

        <!-- FORM BARANG -->
        <section class="card">
            <h2>Tambah Barang</h2>

            <form id="formBarang">

                <div class="form-group">
                    <label for="namaBarang">Nama Barang</label>
                    <input
                        type="text"
                        id="namaBarang"
                        placeholder="Contoh: Buku Tulis"
                    >
                    <small id="errorNama" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="hargaBarang">Harga Satuan</label>
                    <input
                        type="number"
                        id="hargaBarang"
                        placeholder="Minimal Rp 500"
                    >
                    <small id="errorHarga" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="qtyBarang">Jumlah / Qty</label>
                    <input
                        type="number"
                        id="qtyBarang"
                        placeholder="Minimal 1"
                    >
                    <small id="errorQty" class="error"></small>
                </div>

                <button type="submit" class="btn-primary">
                    + Tambah ke Keranjang
                </button>

            </form>
        </section>

        <!-- KERANJANG -->
        <section class="card">
            <div class="section-title">
                <h2>Keranjang Belanja</h2>
                <span id="jumlahItem">0 Item</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Barang</th>
                            <th>Harga Satuan</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelKeranjang">
                        <!-- Data barang ditampilkan melalui JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="keranjangKosong" class="empty">
                Keranjang masih kosong.
            </div>
        </section>

        <!-- RINGKASAN -->
        <section class="card summary">

            <h2>Ringkasan Pembayaran</h2>

            <div class="summary-row">
                <span>Total Belanja</span>
                <strong id="totalBelanja">Rp 0</strong>
            </div>

            <div class="summary-row">
                <span>Diskon 10%</span>
                <strong id="diskon">Rp 0</strong>
            </div>

            <div class="summary-row total">
                <span>Total Akhir</span>
                <strong id="totalAkhir">Rp 0</strong>
            </div>

            <div class="payment">
                <label for="uangBayar">Uang Bayar</label>

                <input
                    type="number"
                    id="uangBayar"
                    placeholder="Masukkan uang yang diterima"
                >

                <div id="statusPembayaran" class="payment-status">
                    Masukkan nominal pembayaran.
                </div>

                <div class="summary-row">
                    <span>Kembalian</span>
                    <strong id="kembalian">Rp 0</strong>
                </div>
            </div>

            <button id="btnReset" class="btn-danger">
                Transaksi Baru
            </button>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
